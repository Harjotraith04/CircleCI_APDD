version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5
    working_directory: ~/project

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run:
          name: Install Dependencies
          command: npm install
      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Build React App
          command: npm run build
      - persist_to_workspace:
          root: .
          paths: 
            - build

  deploy:
    docker:
      - image: appropriate/curl
    steps:
      - attach_workspace:
          at: /workspace
      - run:
          name: Deploy to Hosting Platform
          command: |
            # Replace this with your deployment command
            echo "Deploying to FTP..."
            # Example: curl -T /workspace/build ftp://user:password@ftp.example.com/path/

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
